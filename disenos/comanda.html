<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food and Friends · Carta</title>
<meta name="theme-color" content="#2a2622">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mesa: #2a2622;
    --papel: #fffdf4;
    --tinta: #1f1c19;
    --suave: #6b635b;
    --linea: #c9c1b4;
    --sello: #c8331f;
    --nav: 60px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--mesa); color: var(--tinta);
    font: 16px/1.45 "Courier Prime", "Courier New", monospace;
    padding: calc(22px + env(safe-area-inset-top)) 10px calc(34px + env(safe-area-inset-bottom));
  }
  a { color: inherit; }
  :focus-visible { outline: 2px dashed var(--tinta); outline-offset: 3px; }

  /* El papel, con los bordes rasgados arriba y abajo */
  .papel { position: relative; max-width: 480px; margin: 0 auto; background: var(--papel); box-shadow: 0 18px 40px rgba(0, 0, 0, .35); }
  .papel::before, .papel::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; }
  .papel::before { top: -9px; background: conic-gradient(from 135deg at top, var(--papel) 90deg, transparent 0) 50% / 18px 100%; }
  .papel::after { bottom: -9px; background: conic-gradient(from -45deg at bottom, var(--papel) 90deg, transparent 0) 50% / 18px 100%; }
  .col { padding: 0 20px; }
  .raya { margin: 18px 0; border: 0; border-top: 2px dashed var(--linea); }

  .hero { padding-top: 30px; text-align: center; }
  #cabecera { display: flex; flex-direction: column; align-items: center; }
  h1 { order: -1; margin: 0 0 12px; line-height: 0; }
  .logo { width: 124px; height: 124px; }
  .lugar { margin: 0; color: var(--suave); font-size: .82rem; text-transform: uppercase; }
  .subtitulo { margin: 12px 0 0; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .subtitulo::before { content: "*** "; }
  .subtitulo::after { content: " ***"; }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 10px;
    border: 2px solid var(--tinta); font-weight: 700; text-transform: uppercase; font-size: .9rem; text-decoration: none;
  }
  .btn.principal { background: var(--tinta); color: var(--papel); }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: .9rem; text-transform: uppercase; }
  .meta dt { color: var(--suave); }
  .meta dd { margin: 0; text-align: right; }
  .meta .blanco { display: inline-block; width: 70px; border-bottom: 1.5px solid var(--tinta); }

  .cats { position: sticky; top: 0; z-index: 10; background: var(--papel); border-top: 2px dashed var(--linea); border-bottom: 2px dashed var(--linea); }
  .cats ul { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0; padding: 7px 14px; list-style: none; }
  .cats ul::-webkit-scrollbar { display: none; }
  .cats a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; white-space: nowrap; text-decoration: none; text-transform: uppercase; font-weight: 700; font-size: .9rem; }
  .cats a::before { content: "["; margin-right: 4px; color: var(--linea); }
  .cats a::after { content: "]"; margin-left: 4px; color: var(--linea); }
  .cats a[aria-current="true"] { background: var(--tinta); color: var(--papel); }

  .cat { scroll-margin-top: calc(var(--nav) + 4px); padding-top: 26px; }
  h2 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.08rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  h2::before, h2::after { content: ""; flex: 1; border-top: 2px solid var(--tinta); }
  h2 .num { order: -1; display: none; }
  .nota-cat { margin: 6px 0 0; text-align: center; color: var(--suave); font-size: .9rem; }
  .platos { margin: 10px 0 0; padding: 0; list-style: none; }
  .plato { padding: 9px 0; }
  .fila { display: flex; align-items: baseline; }
  .nombre { font-weight: 700; line-height: 1.3; }
  .puntos { flex: 1 1 14px; min-width: 14px; margin: 0 6px; border-bottom: 2px dotted var(--linea); transform: translateY(-4px); }
  .precio { font-weight: 700; white-space: nowrap; }
  .desc { margin: 1px 0 0; color: var(--suave); font-size: .9rem; }
  .marca { display: inline-block; margin-left: 2px; font-size: .78rem; text-transform: uppercase; color: var(--sello); }
  .marca::before { content: "["; } .marca::after { content: "]"; }
  .plato.agotado .nombre, .plato.agotado .desc, .plato.agotado .precio { color: var(--suave); }
  .plato.agotado .precio { text-decoration: line-through; }
  .plato.agotado .marca {
    padding: 0 6px; border: 2px solid var(--sello); border-radius: 4px; color: var(--sello);
    font-weight: 700; letter-spacing: .08em; transform: rotate(-7deg);
  }
  .plato.agotado .marca::before, .plato.agotado .marca::after { content: none; }

  footer .col { padding-bottom: 30px; }
  footer h3 { margin: 0; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; color: var(--suave); }
  footer .bloque { margin-bottom: 14px; }
  footer p { margin: 0; }
  .horario { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; margin: 0; }
  .horario dd { margin: 0; text-align: right; }
  .redes { display: flex; gap: 8px; }
  .redes .btn { min-height: 40px; padding: 0 12px; }
  .pie-nota { color: var(--suave); font-size: .85rem; }
  .arriba { display: inline-block; margin-top: 6px; color: var(--suave); }
  .total { display: flex; align-items: baseline; font-weight: 700; text-transform: uppercase; font-size: 1.05rem; }
  .total .puntos { flex: 1; margin: 0 6px; border-bottom: 2px dotted var(--linea); transform: translateY(-4px); }
  .codigo {
    height: 46px; width: 76%; margin: 18px auto 6px;
    background: repeating-linear-gradient(90deg,
      var(--tinta) 0 2px, transparent 2px 4px, var(--tinta) 4px 5px, transparent 5px 8px,
      var(--tinta) 8px 11px, transparent 11px 12px, var(--tinta) 12px 13px, transparent 13px 16px,
      var(--tinta) 16px 17px, transparent 17px 19px, var(--tinta) 19px 22px, transparent 22px 25px);
  }
  .gracias { margin: 0; text-align: center; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="papel" id="arriba">
  <header class="hero">
    <div class="col" id="cabecera"></div>
    <div class="col">
      <hr class="raya">
      <dl class="meta">
        <dt>Mesa</dt><dd><span class="blanco"></span></dd>
        <dt>Fecha</dt><dd id="fecha"></dd>
      </dl>
      <hr class="raya" style="margin-bottom: 0">
    </div>
  </header>
  <nav class="cats" id="nav" aria-label="Categorías de la carta"><ul id="chips"></ul></nav>
  <main class="col" id="carta"></main>
  <footer>
    <div class="col">
      <hr class="raya" style="margin-top: 26px">
      <div class="total"><span>Total</span><span class="puntos"></span><span>¡Buen provecho!</span></div>
      <hr class="raya">
      <div id="pie"></div>
      <div class="codigo" aria-hidden="true"></div>
      <p class="gracias">Gracias por venir</p>
    </div>
  </footer>
</div>
<script src="muestra.js?v=202609301437"></script>
<script src="propuesta.js?v=202609301437"></script>
<script src="../js/carta.js?v=202609301437"></script>
<script>
  document.getElementById('fecha').textContent = new Date().toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });
</script>
</body>
</html>
