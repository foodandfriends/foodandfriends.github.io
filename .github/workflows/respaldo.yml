name: Respaldo diario de la carta

# Guarda una copia de la carta y de sus fotos en datos/. La carta pública sirve las fotos desde ahí.
on:
  schedule:
    - cron: "17 11 * * *"   # todos los días a las 6:17 a. m. hora de Colombia
  workflow_dispatch:         # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write
  actions: write             # solo para el último paso (mantener la tarea prendida)

jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Bajar la carta de Firebase
        run: node scripts/respaldo.mjs
      - name: Guardar la copia si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || { git commit -m "Respaldo diario de la carta" && git push; }
      # GitHub apaga las tareas diarias de un repositorio que pasa 60 días sin cambios (si la carta
      # no cambia, el respaldo no guarda nada). Volver a prenderla cada día evita que se apague sola
      - name: Mantener la tarea prendida
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/respaldo.yml/enable"
